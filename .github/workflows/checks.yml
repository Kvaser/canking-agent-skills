name: checks

on:
  push:
    branches: [main]
  pull_request:

# The whole job is a diff. Nothing here needs write access.
permissions:
  contents: read

jobs:
  sync-references:
    name: Shared reference copies in sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shared reference copies
        run: bash tools/sync-references.sh
